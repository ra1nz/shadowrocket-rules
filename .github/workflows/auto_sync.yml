name: Sync Upstream & Overlay Custom Rules

on:
  schedule:
    # Run daily at 13:00 UTC (21:00 CST), ~2 hours after upstream's 11:00 UTC release
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "ra1nz"
          git config user.email "ra1nz@users.noreply.github.com"

      - name: Setup Upstream Remote
        run: |
          git remote add upstream https://github.com/GMOogway/shadowrocket-rules.git || git remote set-url upstream https://github.com/GMOogway/shadowrocket-rules.git
          git fetch upstream master

      - name: Reset to Upstream Master & Apply Overlays
        run: |
          # 1. Reset working tree to upstream master
          git reset --hard upstream/master

          # 2. Keep customized factory templates
          git checkout origin/feature/apple-intelligence-rules -- factory/ || true

          # 3. Run overlay script (updates .module files AND writes fully optimized tiny.conf)
          python3 scripts/sync_overlay.py

      - name: Commit and Push
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            UPSTREAM_MSG=$(git log -1 --pretty=%B upstream/master)
            git commit -m "chore(sync): sync upstream and overlay custom rules" -m "Upstream: $UPSTREAM_MSG"
            git push origin master --force
          fi

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/ra1nz/shadowrocket-rules@master/docs/03.shadowsocks_tiny.conf" || true
          curl -s "https://purge.jsdelivr.net/gh/ra1nz/shadowrocket-rules@master/sr_proxy_list.module" || true
          curl -s "https://purge.jsdelivr.net/gh/ra1nz/shadowrocket-rules@master/sr_direct_list.module" || true
          curl -s "https://purge.jsdelivr.net/gh/ra1nz/shadowrocket-rules@master/sr_reject_list.module" || true
